<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <link rel="stylesheet" href="./style/main.css">
    <title>Document</title>
</head>
<body>
   <main class="conteiner_slot">
    <section class="conteiner_information">
        <div class="conteiner_itens">
            <h1 class="title_slot">Slot Machine Cat</h1>
            <i class="i_coin"><img src="" /></i>
            
       
            <span class="js_progress">
                <h3 class="p_level">Nivel</h3>
                <h3 id="level" class="level">0</h3>
                <p class="p_xp">XP</p>
                <span class="progress">
                    <progress id="js_progress" value="0"></progress>
               
                </span>
                <h3 class="moeda">Moedas</h3>
                <h3 class="coin" id="js_coin">0</h3>
            </span>
            
        </div>
    </section>
    <section class="conteiner_machine">
        <div class="machine_out">
            <div class="rectangle_one">
                <img src="" alt="" id="img_1" class="img_slot">
            </div>
            <div class="rectangle_one">
                <img src="" alt="" id="img_2" class="img_slot"></div>
            <div class="rectangle_one">
                <img src="" alt="" id="img_3" class="img_slot">
            </div>
          
        </div>
        <button id="btn_play" class="btn_player">Jogar</button>
        <div class="Information_play">
            <button id="up" class="btn_coins">+</button>
            <button id="down" class="btn_coins">-</button>
            <p id="value_coins" class="coin_have">0,00</p>
        </div>
    </section>
    <script src="scripts/script.js"></script>
   </main>
</body>
</html>
